[package]
name = "repopilot"
version = "0.2.0"
description = "RepoPilot desktop Git dashboard"
authors = ["RepoPilot"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "repopilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
